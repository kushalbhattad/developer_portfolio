<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f59e0b"/>
      <stop offset="75%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Background Dark Canvas -->
  <rect width="500" height="500" rx="24" fill="#0c1310"/>
  
  <!-- Outer Gold Frame -->
  <rect x="25" y="25" width="450" height="450" rx="16" fill="none" stroke="url(#goldGradient)" stroke-width="2.5" stroke-opacity="0.8"/>
  <rect x="32" y="32" width="436" height="436" rx="12" fill="none" stroke="#d97706" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- TOP BRAND TITLE -->
  <text x="250" y="68" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="22" font-weight="700" letter-spacing="4" fill="#fef08a">NAKSHATRA DIGITAL</text>

  <!-- CENTER EMBLEM: Celestial Orbit Ring -->
  <circle cx="250" cy="250" r="140" fill="none" stroke="url(#goldGradient)" stroke-width="1.5" stroke-opacity="0.6"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="#e0f2fe" stroke-width="1" stroke-dasharray="3,6" stroke-opacity="0.5"/>

  <!-- Constellation Eagle Wings (Left & Right Symmetric / Dynamic) -->
  <g stroke="url(#goldGradient)" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- Body & Spine -->
    <path d="M250,150 L250,330" stroke-opacity="0.5"/>
    
    <!-- Wing Feathers Left -->
    <path d="M250,220 L130,120 L180,210 L120,150 L195,235 L115,185 L210,255 L130,230 L225,270 L150,270 L240,290" />
    <path d="M130,120 L180,210 L195,235 L210,255 L225,270 L240,290" fill="url(#goldGradient)" fill-opacity="0.08"/>
    
    <!-- Wing Feathers Right -->
    <path d="M250,220 L370,120 L320,210 L380,150 L305,235 L385,185 L290,255 L370,230 L275,270 L350,270 L260,290" />
    <path d="M370,120 L320,210 L305,235 L290,255 L275,270 L260,290" fill="url(#goldGradient)" fill-opacity="0.08"/>

    <!-- Tail Feathers -->
    <path d="M250,290 L210,360 L235,340 L250,370 L265,340 L290,360 L250,290" fill="url(#goldGradient)" fill-opacity="0.1"/>

    <!-- Eagle Head & Beak -->
    <path d="M250,150 L270,180 L295,190 L270,198 L250,200 Z" fill="url(#goldGradient)" fill-opacity="0.3"/>
  </g>

  <!-- Constellation Lines & Triangles -->
  <g stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.7" fill="none">
    <line x1="130" y1="120" x2="250" y2="250"/>
    <line x1="370" y1="120" x2="250" y2="250"/>
    <line x1="180" y1="210" x2="320" y2="210"/>
    <line x1="120" y1="150" x2="250" y2="250"/>
    <line x1="380" y1="150" x2="250" y2="250"/>
    <line x1="210" y1="360" x2="290" y2="360"/>
  </g>

  <!-- Glowing Sun Center Disk -->
  <circle cx="250" cy="250" r="32" fill="url(#sunGlow)"/>
  <circle cx="250" cy="250" r="18" fill="#fef08a"/>
  
  <!-- Sun Rays -->
  <g stroke="#f59e0b" stroke-width="2">
    <line x1="250" y1="205" x2="250" y2="215"/>
    <line x1="250" y1="285" x2="250" y2="295"/>
    <line x1="205" y1="250" x2="215" y2="250"/>
    <line x1="285" y1="250" x2="295" y2="250"/>
    <line x1="218" y1="218" x2="225" y2="225"/>
    <line x1="275" y1="275" x2="282" y2="282"/>
    <line x1="282" y1="218" x2="275" y2="225"/>
    <line x1="225" y1="275" x2="218" y2="282"/>
  </g>

  <!-- Constellation Glowing Star Nodes -->
  <!-- Wing Top Nodes -->
  <circle cx="130" cy="120" r="5" fill="#ffffff"/>
  <circle cx="130" cy="120" r="10" fill="url(#starGlow)"/>
  <circle cx="370" cy="120" r="5" fill="#ffffff"/>
  <circle cx="370" cy="120" r="10" fill="url(#starGlow)"/>

  <!-- Wing Mid Nodes -->
  <circle cx="180" cy="210" r="4" fill="#ffffff"/>
  <circle cx="320" cy="210" r="4" fill="#ffffff"/>
  <circle cx="120" cy="150" r="4" fill="#ffffff"/>
  <circle cx="380" cy="150" r="4" fill="#ffffff"/>
  <circle cx="195" cy="235" r="3" fill="#38bdf8"/>
  <circle cx="305" cy="235" r="3" fill="#38bdf8"/>
  <circle cx="115" cy="185" r="3" fill="#ffffff"/>
  <circle cx="385" cy="185" r="3" fill="#ffffff"/>

  <!-- Orbit Ring Star Nodes -->
  <circle cx="250" cy="110" r="4" fill="#fef08a"/>
  <circle cx="250" cy="390" r="4" fill="#fef08a"/>
  <circle cx="110" cy="250" r="4" fill="#fef08a"/>
  <circle cx="390" cy="250" r="4" fill="#fef08a"/>

  <circle cx="151" cy="151" r="3" fill="#ffffff"/>
  <circle cx="349" cy="151" r="3" fill="#ffffff"/>
  <circle cx="151" cy="349" r="3" fill="#ffffff"/>
  <circle cx="349" cy="349" r="3" fill="#ffffff"/>

  <!-- BOTTOM SUBTITLE TITLE -->
  <text x="250" y="445" text-anchor="middle" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="30" font-weight="600" letter-spacing="3" fill="#f59e0b">Solutions</text>
</svg>
